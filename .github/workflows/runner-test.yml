name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Check runner
        run: |
          echo "Self-hosted runner is working!"
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          docker --version
          kubectl version --client
          minikube version
